upstream rgnfarmasystem_app { server app:8000; }
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    location /static/ { alias /var/www/static/; expires 7d; add_header Cache-Control "public, immutable"; }
    location ^~ /media/protected/ { return 404; }
    location /media/ { alias /var/www/media/; expires 1h; add_header X-Content-Type-Options nosniff; }
    location / {
        proxy_pass http://rgnfarmasystem_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS before reaching the internal HTTP origin.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
