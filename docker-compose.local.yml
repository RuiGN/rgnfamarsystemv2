name: rgnfarmasystem-local

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "4127:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: erp.localhost' http://127.0.0.1/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: {context: .}
    image: rgnfarmasystem:local
    restart: unless-stopped
    env_file: ["${LOCAL_ENV_FILE:-.env.local}"]
    environment: *app-environment
    expose: ["8000"]
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: erp.localhost' http://127.0.0.1:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 600s

  celery_worker:
    image: rgnfarmasystem:local
    restart: unless-stopped
    entrypoint: [/app/worker-entrypoint.sh]
    command: [celery, -A, core, worker, -l, INFO]
    env_file: ["${LOCAL_ENV_FILE:-.env.local}"]
    environment: *app-environment
    volumes:
      - ./media:/app/media
    depends_on:
      app: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery_beat:
    image: rgnfarmasystem:local
    restart: unless-stopped
    entrypoint: [/app/worker-entrypoint.sh]
    command: [celery, -A, core, beat, -l, INFO, --scheduler, django_celery_beat.schedulers:DatabaseScheduler]
    env_file: ["${LOCAL_ENV_FILE:-.env.local}"]
    environment: *app-environment
    depends_on:
      app: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data_local:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data_local:
  rabbitmq_data_local:
