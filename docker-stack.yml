services:
  traefik:
    image: traefik:v3.2
    command:
      - --providers.file=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.cloudflare.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --ping=true
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/CLOUDFLARE_DNS_API_TOKEN
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - CLOUDFLARE_DNS_API_TOKEN
    networks:
      - traefik_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  app:
    image: ghcr.io/ruign/rgnfarmasystem:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik_public
      - rgnfarmasystem_internal
    ports:
      - target: 8000
        published: 4127
        protocol: tcp
        mode: ingress
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 768M
      labels:
        - traefik.enable=true
        - traefik.http.routers.rgnfarmasystem.rule=Host(`rgnfarmasystem.rgnsystems.com.br`)
        - traefik.http.routers.rgnfarmasystem.entrypoints=websecure
        - traefik.http.routers.rgnfarmasystem.tls.certresolver=cloudflare
        - traefik.http.routers.rgnfarmasystem.tls.domains[0].main=rgnfarmasystem.rgnsystems.com.br
        - traefik.http.services.rgnfarmasystem.loadbalancer.server.port=8000

  celery_worker:
    image: ghcr.io/ruign/rgnfarmasystem:${IMAGE_TAG:-latest}
    entrypoint: /app/worker-entrypoint.sh
    command: celery -A core worker -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rgnfarmasystem_internal
      - rgnfarmasystem_egress
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping --destination celery@$$(hostname) --timeout=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 768M

  celery_beat:
    image: ghcr.io/ruign/rgnfarmasystem:${IMAGE_TAG:-latest}
    entrypoint: /app/worker-entrypoint.sh
    command: celery -A core beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rgnfarmasystem_internal
      - rgnfarmasystem_egress
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; cmds=[' '.join(p.read_text(errors='ignore').split('\\\\0')) for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')]; sys.exit(0 if any('celery' in c and 'beat' in c for c in cmds) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.10"
          memory: 192M
        limits:
          cpus: "0.50"
          memory: 384M

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - rgnfarmasystem_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rgnfarmasystem_internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          cpus: "0.25"
          memory: 384M
        limits:
          cpus: "1.00"
          memory: 768M

  backup_uploader:
    image: ghcr.io/ruign/rgnfarmasystem:${IMAGE_TAG:-latest}
    entrypoint: /app/scripts/backup_to_drive.sh
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rgnfarmasystem_internal
      - rgnfarmasystem_egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backups:/var/backups/rgnfarmasystem
      - backup_logs:/var/log/rgnfarmasystem
    secrets:
      - GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last_backup_run_at && test $$(($$(date +%s) - $$(cat /tmp/last_backup_run_at))) -lt 90000 || (test -f /var/backups/rgnfarmasystem/postgres-*.sql.gz -o -f /var/log/rgnfarmasystem/backup-to-drive.log )"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 1h
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 1h
        max_attempts: 3
        window: 24h
      resources:
        reservations:
          cpus: "0.10"
          memory: 192M
        limits:
          cpus: "0.50"
          memory: 384M

secrets:
  CLOUDFLARE_DNS_API_TOKEN:
    external: true
  GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:
    external: true

volumes:
  redis_data:
  rabbitmq_data:
  media:
  staticfiles:
  letsencrypt:
  backups:
  backup_logs:

networks:
  traefik_public:
    external: true
  rgnfarmasystem_internal:
    driver: overlay
    internal: true
  rgnfarmasystem_egress:
    external: true
