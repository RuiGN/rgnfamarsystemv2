[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/**", ".worktrees", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"core/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
allow_untyped_globals = true
follow_imports = "skip"
disable_error_code = ["var-annotated"]
exclude = "(^|/)migrations/"

[tool.coverage.run]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "core/asgi.py",
  "core/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
