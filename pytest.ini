[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = --reuse-db
markers =
    legacy_api_permissions: fluxo funcional legado que solicita explicitamente o papel de acesso total
    permission_strict: cenário de autorização com permissões mínimas declaradas pelo teste
filterwarnings =
    ignore:The default value of `allowed_objects` will change in a future version.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning:langgraph.cache.base
