{% if actions %}
<section class="card stretch stretch-full mb-4" aria-labelledby="resource-actions-title" data-ui="resource-actions">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
            <span class="avatar-text avatar-md bg-soft-primary text-primary" aria-hidden="true">
                <i class="feather-zap"></i>
            </span>
            <div>
                <span class="fs-11 fw-bold text-uppercase text-muted">Fluxo operacional</span>
                <h2 id="resource-actions-title" class="h6 mb-0">Ações disponíveis</h2>
            </div>
            <span class="badge bg-soft-primary text-primary" aria-label="{{ actions|length }} ações disponíveis">{{ actions|length }}</span>
        </div>
        <div class="d-flex flex-wrap align-items-center justify-content-end gap-2" role="list">
            {% for action in actions %}
            <a
                href="{% if action.detail %}{% url 'app:resource_action' module.slug resource.slug object.pk action.action_name %}{% else %}{% url 'app:collection_action' module.slug resource.slug action.action_name %}{% endif %}"
                class="btn btn-sm {% if action.tone == 'primary' %}btn-light-brand{% else %}btn-outline-{{ action.tone }}{% endif %} d-inline-flex align-items-center gap-2"
                data-domain-action
                data-action-label="{{ action.label }}"
                data-action-tone="{{ action.tone }}"
                aria-haspopup="dialog"
                aria-label="{{ action.label }}: {{ action.description }}"
                role="listitem"
            >
                <i class="{{ action.icon }}" aria-hidden="true"></i>
                {{ action.label }}
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
