<article class="card stretch stretch-full h-100" data-ui="progress-metric">
    <div class="card-body d-flex flex-column">
        <div class="d-flex align-items-start justify-content-between mb-4">
            <div class="d-flex gap-4 align-items-center">
                <div class="avatar-text avatar-lg bg-soft-{{ metric.tone }} text-{{ metric.tone }}">
                    <i class="{{ metric.icon }}" aria-hidden="true"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold text-dark">{{ metric.value }}{% if metric.has_progress %}<span class="fs-13 fw-normal text-muted"> de {{ metric.target }}</span>{% endif %}</div>
                    <h2 class="fs-13 fw-semibold mb-0">{{ metric.label }}</h2>
                    {% if metric.helper %}<p class="fs-12 text-muted mb-0">{{ metric.helper }}</p>{% endif %}
                </div>
            </div>
            <span class="badge bg-soft-{{ metric.tone }} text-{{ metric.tone }}">{{ metric.badge }}</span>
        </div>
        {% if metric.has_progress %}
        <div class="progress mt-2 ht-3" aria-hidden="true">
            <div class="progress-bar bg-{{ metric.tone }}" style="width: {{ metric.percent }}%"></div>
        </div>
        <span class="visually-hidden" role="progressbar"
              aria-label="Progresso de {{ metric.label }}"
              aria-valuemin="0" aria-valuemax="100"
              aria-valuenow="{{ metric.percent }}">{{ metric.percent }}%</span>
        {% endif %}
        <div class="pt-4 border-top mt-auto">
            <a href="{{ metric.url }}" class="fs-12 fw-medium text-muted">Ver detalhes</a>
        </div>
    </div>
</article>
